<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events assignments</title>
  </head>
  <body>
    <h1>Events Assingements</h1>
    <div>
      <ul>
        <li id="clickme">Mouse Events</li>
        <li id="Keyboard" tabindex="0">Keyboard Events</li>
        <h1>Form</h1>
        <form id="form" action="">
          <label for="name">Fullname</label>
          <input type="text" id="name" placeholder="Enter your FullName : " />

          <label for="email">Email</label>
          <input type="email" id="copyBox" placeholder="san@gmail.com " />

          <label for="password">Password</label>
          <input type="password" placeholder="****** " />

          <button type="submit">Submit</button>
        </form>

        <li>
          <iframe
            width="300"
            height="200"
            src="https://www.youtube.com/embed/HJFxTsX0Ok0"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          >
          </iframe>
        </li>
      </ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
