<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="background-color: rgb(206, 188, 223)">
    <nav>
      <div class="logo">Sanskruti</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="hobbies.html">Hobbies</a>
        <a href="Summery.html">Summary</a>
        <a href="Contact.html">Contact</a>
      </div>
    </nav>

    <div class="card">
      <h1>Home page</h1>
      <hr class="dark-line" />
      <div class="notebook-lines"></div>

      <div
        style="border: 2px dashed rgb(65, 238, 42); background-color: thistle"
      >
        <form>
          <label for="Name">Name : </label> <br />
          <input class="in" type="text" placeholder="Enter your name " /> <br />
          <br />
          <label for="Email">Email : </label> <br />
          <input class="in" type="Email" placeholder="san@gmail.com" /> <br />
          <br />
          <label for="password">Password : </label> <br />
          <input class="in" type="password" placeholder="********" /> <br />
          <br />
          <label>Gender:</label> <br />
          <input type="radio" id="male" name="gender" value="male" />
          <label for="male">Male ♂️</label>

          <input type="radio" id="female" name="gender" value="female" />
          <label for="female">Female ♀️</label>

          <input type="radio" id="other" name="gender" value="other" />
          <label for="other">Other ⚧️</label>

          <label for="city">City:</label><br />
          <select id="city" name="city">
            <option value="">--Select your city--</option>
            <option value="mumbai">Mumbai</option>
            <option value="pune">Pune</option>
            <option value="delhi">Delhi</option>
            <option value="bangalore">Bangalore</option>
            <option value="hyderabad">Hyderabad</option></select
          ><br /><br />
          <label for="mes">Message:</label><br />
          <textarea
            id="mes"
            rows="5"
            cols="30"
            placeholder="Type your message here..."
          ></textarea>

          <button type="submit">Submit</button>
        </form>
      </div>

      <br />
      &#127800; &#127800; &#127800; &#127800;
    </div>
  </body>
</html>
